<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>G2 线条视界</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, -apple-system, "PingFang TC", sans-serif; background: #0b0f0b; color: #d8f5d8; }
      main { max-width: 640px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
      h1 { font-size: 18px; margin: 0; }
      .screen { position: relative; width: 100%; aspect-ratio: 2 / 1; background: #000; border-radius: 10px; overflow: hidden; border: 1px solid #1f3a1f; }
      .screen canvas { width: 100%; height: 100%; display: block; }
      .tag { position: absolute; left: 8px; top: 6px; font-size: 11px; color: #6c9; opacity: .8; }
      video { display: none; }
      .row { display: flex; gap: 10px; }
      button { flex: 1; padding: 14px 10px; font-size: 16px; border-radius: 10px; border: 0; background: #2fbf5a; color: #021; font-weight: 600; }
      button.secondary { background: #1d2b1d; color: #cfe; border: 1px solid #2f4f2f; }
      button:disabled { opacity: .45; }
      label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
      input[type=range] { width: 100%; }
      #status { font-size: 13px; color: #8db; min-height: 1.4em; white-space: pre-line; }
      .seg { display: flex; gap: 0; border: 1px solid #2f4f2f; border-radius: 10px; overflow: hidden; }
      .seg button { border-radius: 0; background: #111a11; color: #9cb; font-weight: 500; padding: 10px; }
      .seg button.on { background: #2fbf5a; color: #021; font-weight: 700; }
      .help { font-size: 12px; color: #7a9; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>G2 线条视界</h1>
      <div class="screen">
        <canvas id="preview" width="576" height="288"></canvas>
        <span class="tag">眼镜画面预览</span>
      </div>
      <div class="seg">
        <button data-mode="lines">线条</button>
        <button data-mode="sketch">素描</button>
        <button data-mode="photo">照片</button>
      </div>
      <div id="status">准备中…</div>
      <div class="row">
        <button id="shot">拍一张</button>
        <button id="live" class="secondary">开始实时</button>
      </div>
      <label>亮度：<span id="brightVal">6</span>
        <input id="bright" type="range" min="1" max="10" value="6" />
      </label>
      <label>线条灵敏度（线条、素描模式）：<span id="sensVal">5</span>
        <input id="sens" type="range" min="1" max="10" value="5" />
      </label>
      <label>线条粗细：<span id="thickVal">1</span>
        <input id="thick" type="range" min="0" max="2" value="1" />
      </label>
      <div class="help">
        眼镜操作：单击＝拍一张（实时中＝暂停 / 继续）　长按＝切换模式　上滑 / 下滑＝调灵敏度（照片模式＝调亮度）　双击＝退出<br />
        手机请拿稳、镜头朝前。画面每 1～2 秒更新一次。
      </div>
      <video id="video" playsinline muted autoplay></video>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
